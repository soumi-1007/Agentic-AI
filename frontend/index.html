<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Customer Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Application Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">🛒</div>
        <div class="brand-text">
          <h1>E-Commerce Customer Support</h1>
          <span class="status-badge"><span class="status-dot"></span> Assistant Online</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="header-new-chat-btn" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          New Chat
        </button>
      </div>
    </header>

    <!-- Main Application Layout -->
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-section">
          <button id="sidebar-new-chat-btn" class="btn btn-primary btn-block">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            New Conversation
          </button>
        </div>

        <div class="sidebar-section">
          <h3 class="section-title">Quick Actions</h3>
          <div class="quick-actions-list">
            <button class="quick-action-card" data-query="Where is my order ORD-1001?">
              <span class="action-icon">📦</span>
              <div class="action-info">
                <span class="action-title">Track My Order</span>
                <span class="action-desc">Check shipment & delivery status</span>
              </div>
            </button>
            <button class="quick-action-card" data-query="Tell me about your return policy">
              <span class="action-icon">📜</span>
              <div class="action-info">
                <span class="action-title">Return Policy</span>
                <span class="action-desc">Window, fees, & refund rules</span>
              </div>
            </button>
            <button class="quick-action-card" data-query="My package arrived with damaged headphones ORD-1001">
              <span class="action-icon">⚠️</span>
              <div class="action-info">
                <span class="action-title">Report a Complaint</span>
                <span class="action-desc">Damaged, missing, or wrong items</span>
              </div>
            </button>
            <button class="quick-action-card" data-query="I want to speak with a human support agent">
              <span class="action-icon">👤</span>
              <div class="action-info">
                <span class="action-title">Human Support</span>
                <span class="action-desc">Escalate to support specialist</span>
              </div>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="chat-area">
        <!-- Scrollable Messages Stream -->
        <div id="chat-messages" class="messages-container">
          <!-- Welcome Hero Banner -->
          <div class="welcome-banner">
            <div class="welcome-icon">💬</div>
            <h2>Welcome to E-Commerce Support</h2>
            <p>How can I assist you today? Ask about your order status, store policies, or log a complaint for human support review.</p>
            <div class="sample-queries">
              <button class="chip-query" data-query="Where is my order ORD-1001?">Where is my order ORD-1001?</button>
              <button class="chip-query" data-query="What is your return policy?">What is your return policy?</button>
              <button class="chip-query" data-query="My order ORD-1005 is delayed">Order ORD-1005 status</button>
            </div>
          </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="typing-indicator hidden">
          <div class="typing-avatar">🤖</div>
          <div class="typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-text">Support agent is thinking...</span>
          </div>
        </div>

        <!-- Chat Input Footer -->
        <div class="chat-input-container">
          <div class="input-wrapper">
            <textarea id="user-input" placeholder="Ask about an order (e.g., ORD-1001), store policies, or complaints..." rows="1"></textarea>
            <div class="input-actions">
              <button id="clear-chat-btn" class="btn btn-icon" title="Clear Conversation">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              </button>
              <button id="send-btn" class="btn btn-send" disabled>
                <span>Send</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
